name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag name
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Release gates (fail closed)
        run: |
          set -euo pipefail
          fail=0

          # modDesc.xml well-formed
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('modDesc.xml')" \
            && echo "ok: modDesc.xml well-formed" || { echo "FAIL: modDesc.xml malformed"; fail=1; }

          # Lua syntax + unit tests
          for f in scripts/*.lua tests/*.lua; do lua5.1 -e "assert(loadfile('$f'))"; done
          echo "ok: Lua syntax"
          for t in tests/*.test.lua; do lua5.1 "$t" >/dev/null; done
          echo "ok: unit tests"

          # Tag (vX.Y.Z) must match modDesc <version> a.b.c.0
          tag="${{ steps.tag.outputs.name }}"; tagv="${tag#v}"
          desc=$(grep -oE '<version>[0-9.]+</version>' modDesc.xml | grep -oE '[0-9.]+')
          if [ "$desc" != "$tagv.0" ] && [ "$desc" != "$tagv" ]; then
            echo "FAIL: tag $tag vs modDesc version $desc mismatch"; fail=1
          else echo "ok: tag/version agree ($tag ~ $desc)"; fi

          # Debug logging must be off
          if grep -qE 'RMDLogging\.debugEnabled\s*=\s*true' scripts/RMDLogging.lua; then
            echo "FAIL: RMDLogging.debugEnabled = true"; fail=1
          else echo "ok: debug logging off"; fi

          # Icon present
          [ -f icon_RealisticMarketDemand.dds ] && echo "ok: icon present" \
            || { echo "FAIL: icon missing"; fail=1; }

          [ "$fail" -eq 0 ] || { echo "Release gates failed."; exit 1; }

      - name: Build ModHub-ready zip (modDesc.xml at root, runtime files only)
        run: |
          set -euo pipefail
          MOD=FS25_RealisticMarketDemand
          mkdir -p dist
          rm -f "dist/$MOD.zip"
          # LICENSE is intentionally not bundled (game doesn't load it; TestRunner
          # ObsoleteFiles flags it). It stays in the repo.
          zip -X "dist/$MOD.zip" modDesc.xml
          [ -f icon_RealisticMarketDemand.dds ] && zip -X "dist/$MOD.zip" icon_RealisticMarketDemand.dds
          zip -X "dist/$MOD.zip" scripts/*.lua
          if [ -d l10n ]; then zip -r -X "dist/$MOD.zip" l10n; fi
          echo "--- archive contents ---"
          unzip -l "dist/$MOD.zip"

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'PY' > RELEASE_NOTES.md
          import re
          tag = "${{ steps.tag.outputs.name }}".lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|^\[|\Z)" % re.escape(tag),
                        text, re.S | re.M)
          print((m.group(1).strip() if m else "See CHANGELOG.md for details."))
          PY
          echo "--- release notes ---"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: dist/FS25_RealisticMarketDemand.zip
