name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate modDesc.xml is well-formed
        run: |
          python3 - <<'PY'
          import xml.dom.minidom
          xml.dom.minidom.parse("modDesc.xml")
          print("modDesc.xml: well-formed")
          PY

      - name: Set up Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Lua syntax check (all scripts + tests)
        run: |
          set -e
          for f in scripts/*.lua tests/*.lua; do
            lua5.1 -e "assert(loadfile('$f'))"
            echo "ok: $f"
          done

      - name: Run unit tests
        run: |
          set -e
          for t in tests/*.test.lua; do
            echo "== $t =="
            lua5.1 "$t"
          done
